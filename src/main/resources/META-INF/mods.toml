modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Mana and Artifice and its required libraries
[[dependencies.${mod_id}]]
modId="mna"
mandatory=true
versionRange="[${mna_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="curios"
mandatory=true
versionRange="[${curios_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="geckolib"
mandatory=true
versionRange="[${geckolib_version},)"
ordering="AFTER"
side="BOTH"

# Mana and Artifice: Attributes and its required libraries
[[dependencies.${mod_id}]]
modId="mna_attributes"
mandatory=true
versionRange="[${mna_attributes_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="attributeslib"
mandatory=true
versionRange="[${apothic_attributes_version},)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="placebo"
mandatory=true
versionRange="[${placebo_version},)"
ordering="AFTER"
side="BOTH"
